
syntax = "proto3";

package wallet.v1;

import "price/v1/price.proto";
import "google/protobuf/timestamp.proto";

option go_package = "tracker/gen/wallet/v1;walletv1";

import "google/api/annotations.proto";

service WalletService {
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse) {
    option (google.api.http) = {
      get: "/v1/wallets"
    };
  }
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{id}"
    };
  }
  rpc UpdateWallet(UpdateWalletRequest) returns (UpdateWalletResponse) {
    option (google.api.http) = {
      patch: "/v1/wallets/{id}"
      body : "*"
    };
  }
  rpc DeleteWallet(DeleteWalletRequest) returns (DeleteWalletResponse) {
    option (google.api.http) = {
      delete: "/v1/wallets/{id}"
    };
  }
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse) {
    option (google.api.http) = {
      post: "/v1/wallets"
      body: "*"
    };
  }
  rpc ListWalletBalances(ListWalletBalancesRequest) returns (ListWalletBalancesResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{id}/balances"
    };
  }
  rpc StreamWallet(StreamWalletRequest) returns (stream WalletUpdate) {
    option (google.api.http) = {
      get: "/v1/wallets/stream"
    };
  }
}

message ListWalletsRequest {}

message ListWalletsResponse {
  int32           total  = 1;
  repeated Wallet wallet = 2;
}

message GetWalletRequest {
  string id = 1;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message UpdateWalletRequest {
  string id     = 1;
  string label  = 2;
  bool   notify = 3;
}

message UpdateWalletResponse {
  string id     = 1;
  string label  = 2;
  bool   notify = 3;
}

message DeleteWalletRequest {
  string id = 1;
}

message DeleteWalletResponse {
  string deleted_id = 1;
}

message CreateWalletRequest {
  string address      = 1;
  string chain        = 2;
  string token_symbol = 3;
  string label        = 4;
}

message CreateWalletResponse {}

message ListWalletBalancesRequest {
  string        id     = 1;
  BalancePeriod period = 2;
  int32         limit  = 3;
}

message ListWalletBalancesResponse{
  repeated WalletBalance balance = 1;
}

message StreamWalletRequest {
  repeated string symbols = 1;
}

message WalletUpdate {
  Wallet wallet = 1;
}

message Wallet {
  string         id             = 1;
  string         address        = 2;
  string         chain          = 3;
  string         token_symbol   = 4;
  string         label          = 5;
  double         balance_crypto = 6;
  double         balance_usd    = 7;
  bool           has_error      = 8;
  string         error_msg      = 9;
  bool           notify         = 10;
  price.v1.Price price          = 11;
}

message WalletBalance {
  double                    balance_crypto = 1;
  double                    balance_usd    = 2;
  google.protobuf.Timestamp time           = 3;
}

enum BalancePeriod {
  BALANCE_PERIOD_UNSPECIFIED = 0;
  BALANCE_PERIOD_1D          = 1;
  BALANCE_PERIOD_1W          = 2;
  BALANCE_PERIOD_1M          = 3;
  BALANCE_PERIOD_6M          = 4;
  BALANCE_PERIOD_1Y          = 5;
  BALANCE_PERIOD_5Y          = 6;
  BALANCE_PERIOD_ALL         = 7;
}