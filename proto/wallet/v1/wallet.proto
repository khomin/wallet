
syntax = "proto3";

package wallet.v1;
import "google/protobuf/empty.proto";
import "price/v1/price.proto";

option go_package = "tracker/gen/wallet/v1;walletv1";

import "google/api/annotations.proto";

service WalletService {
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse) {
    option (google.api.http) = {
      get: "/v1/wallets"
    };
  }
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{id}"
    };
  }
  rpc EditWallet(EditWalletRequest) returns (EditWalletResponse) {
    option (google.api.http) = {
      patch: "/v1/wallets/{id}"
      body : "*"
    };
  }
  rpc DeleteWallet(DeleteWalletRequest) returns (DeleteWalletResponse) {
    option (google.api.http) = {
      delete: "/v1/wallets/{id}"
    };
  }
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse) {
    option (google.api.http) = {
      post: "/v1/wallets"
      body: "*"
    };
  }
  rpc StreamWallet(StreamWalletRequest) returns (stream WalletUpdate) {
    option (google.api.http) = {
      get: "/v1/wallets/stream"
    };
  }
}

message ListWalletsRequest {}

message ListWalletsResponse {
  int32           total  = 1;
  repeated Wallet wallet = 2;
}

message GetWalletRequest {
  string id = 1;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message EditWalletRequest {
  string id    = 1;
  string label = 2;
}

message EditWalletResponse {
  string id    = 1;
  string label = 2;
}

message DeleteWalletRequest {
  string id = 1;
}

message DeleteWalletResponse {
  string deleted_id = 1;
}

message CreateWalletRequest {
  string address            = 1;
  string chain              = 2;
  string token_symbol       = 3;
  string label              = 4;
}

message CreateWalletResponse {}

message StreamWalletRequest {
  repeated string symbols = 1;
}

message WalletUpdate {
  Wallet wallet =  1;
}

message Wallet {
  string         id                 = 1;
  string         address            = 2;
  string         chain              = 3;
  string         token_symbol       = 4;
  string         label              = 5;
  float          balance_crypto     = 6;
  float          balance_usd        = 7;
  bool           has_error          = 9;
  string         error_msg          = 10;
  price.v1.Price price              = 11;
}