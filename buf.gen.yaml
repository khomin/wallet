version: v2
plugins:
  # 1. Generate Go Protobuf message structs
  - remote: buf.build/protocolbuffers/go
    out: backend/gen
    opt: paths=source_relative

  # 2. Generate Go gRPC server and client interfaces
  - remote: buf.build/grpc/go
    out: backend/gen
    opt: paths=source_relative

  # 3. Generate gRPC-Gateway REST proxy handlers
  - remote: buf.build/grpc-ecosystem/gateway:v2.29.0
    out: backend/gen
    opt: paths=source_relative

  # 4. Generate OpenAPI v3 Specs (Swagger)
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: backend/internal/docs/openapiv2

  # 5a. Generate TypeScript message types
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt:
      - target=ts

  # 5b. Generate TypeScript service clients for React (Connect-ES)
  - remote: buf.build/connectrpc/es
    out: web/src/gen
    opt: 
      - target=ts