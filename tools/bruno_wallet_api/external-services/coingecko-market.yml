info:
  name: coingecko-market
  type: http
  seq: 5

http:
  method: GET
  url: "{{coinGeckoUri}}/api/v3/coins/markets?order=market_cap_desc&per_page=250&vs_currency=usd"
  params:
    - name: order
      value: market_cap_desc
      type: query
    - name: per_page
      value: "250"
      type: query
    - name: vs_currency
      value: usd
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
