info:
  name: get-prices
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/v1/prices?symbols=btc&symbols=trx&symbols=xaut"
  params:
    - name: symbols
      value: btc
      type: query
    - name: symbols
      value: trx
      type: query
    - name: symbols
      value: xaut
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
