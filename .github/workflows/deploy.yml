name: Build and Deploy to NUC

on:
  push:
    tags:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/whale-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ==========================================
      # 2. Build & Push Web Frontend Image
      # ==========================================
      - name: Extract metadata (Web)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/whale-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ==========================================
      # 3. Deploy to k3s via Kubernetes API
      # ==========================================
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Prepare Kustomize Context Files
        run: |
          # create the local copy folder for Kustomize
          mkdir -p backend/k8s/env-context

          # copy realm-export.json into the kustomize directory
          cp backend/deploy/keycloak/realm-export.json backend/k8s/env-context/realm-export.json

          # Write runtime .env from GitHub Secrets
          cat << 'EOF' > backend/k8s/env-context/.env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Deploy Secrets and Kustomize Manifests
        run: |
          # create app-secrets from runtime .env
          kubectl create secret generic app-secrets \
            --from-env-file=backend/k8s/env-context/.env \
            -n whale-tracker-prod \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -k backend/k8s/ -n whale-tracker-prod

          kubectl rollout restart deployment/whale-backend -n whale-tracker-prod
          kubectl rollout restart deployment/whale-frontend -n whale-tracker-prod

          kubectl rollout status deployment/whale-backend -n whale-tracker-prod --timeout=60s
          kubectl rollout status deployment/whale-frontend -n whale-tracker-prod --timeout=60s