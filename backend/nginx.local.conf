server {
    listen 80;
    server_name _;

    # Forward React Dev Server (Vite / CRA)
    # Allows HMR (Hot Module Replacement) to keep working during dev
    location / {
        proxy_pass http://host.docker.internal:5173; # Vite default port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Forward Keycloak traffic through Nginx
    location /auth/ {
        proxy_pass http://host.docker.internal:9090/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /realms/ {
        proxy_pass http://host.docker.internal:9090/realms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Forward Keycloak static resources (CSS/JS for login UI)
    location /resources/ {
        proxy_pass http://host.docker.internal:9090/resources/;
        proxy_set_header Host $host;
    }

    # Forward API requests to Go Backend
    location /api/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streams
    location /api/v1/wallets/stream {
        proxy_pass http://host.docker.internal:8080/v1/wallets/stream;
        # Disable buffering so stream events flush instantly to the frontend
        proxy_buffering off;
        proxy_cache off;
        # Keep connection open for long-lived streams
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        # HTTP/1.1 chunked stream settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Fixed proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}