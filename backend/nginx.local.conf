server {
    listen 80;
    server_name localhost;

    # Forward React Dev Server (Vite / CRA)
    # Allows HMR (Hot Module Replacement) to keep working during dev
    location / {
        proxy_pass http://host.docker.internal:5173; # Vite default port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Forward Keycloak traffic through Nginx
    location /auth/ {
        proxy_pass http://host.docker.internal:9090/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /realms/ {
        proxy_pass http://host.docker.internal:9090/realms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Forward Keycloak static resources (CSS/JS for login UI)
    location /resources/ {
        proxy_pass http://host.docker.internal:9090/resources/;
        proxy_set_header Host $host;
    }

    # Forward API requests to Go Backend
    location /api/ {
        proxy_pass http://host.docker.internal:8080/; # Go default port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward WebSocket connections to Go (if using WS for price streams)
    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}