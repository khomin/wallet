apiVersion: apps/v1
kind: Deployment
metadata:
  name: whale-web
  namespace: whale-tracker-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whale-web
  template:
    metadata:
      labels:
        app: whale-web
    spec:
      containers:
        - name: whale-web
          image: whale-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whale-web
  namespace: whale-tracker-prod
spec:
  type: ClusterIP
  selector:
    app: whale-web
  ports:
    - port: 80
      targetPort: 80