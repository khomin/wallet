apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-deployer-traefik
rules:
  - apiGroups:
      - traefik.io
    resources:
      - middlewares
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-deployer-traefik
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: whale-tracker-prod
roleRef:
  kind: ClusterRole
  name: github-deployer-traefik
  apiGroup: rbac.authorization.k8s.io