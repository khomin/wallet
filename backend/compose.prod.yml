name: whale-tracker

services:
  gateway:
    image: caddy:2-alpine
    container_name: whale_tracker_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../frontend/dist:/srv
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale_tracker_backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_HOST=keycloak_db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_NAME=whale_tracker
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak-db:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: whale_tracker_db
    environment:
      POSTGRES_USER: tracker_admin
      POSTGRES_PASSWORD: super_secure_password
      POSTGRES_DB: whale_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_server
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password123
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./deploy/keycloak/themes/fintech:/opt/keycloak/themes/fintech:ro

  redis:
    image: redis:7-alpine
    container_name: whale_tracker_cache
    ports:
      - "6379:6379"

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=supersecretpassword
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  pgdata:
  postgres_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
